name: Security Scanning Demo

on:
  push:
     branches:
      - main
      - security-test

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:

  # ============================================================
  # 1. GITLEAKS - SECRET SCANNING
  # ============================================================
  gitleaks:
    name: Gitleaks - Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}


  # ============================================================
  # 2. SEMGREP - SAST
  # ============================================================
  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --sarif \
            --output /src/semgrep.sarif

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif


  # ============================================================
  # 3. OWASP DEPENDENCY-CHECK - SCA
  # ============================================================
  dependency-check:
    name: OWASP Dependency Check - SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "DevSecOps Security Demo"
          path: "."
          format: "HTML"
          out: "dependency-check-report"
          args: >
            --failOnCVSS 7

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/


  # ============================================================
  # 4. OSV-SCANNER - SCA
  # ============================================================
  osv:
    name: OSV Scanner - SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            ./


  # ============================================================
  # 5. CHECKOV - INFRASTRUCTURE AS CODE
  # ============================================================
  checkov:
    name: Checkov - IaC Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform
          framework: terraform
          soft_fail: false


  # ============================================================
  # 6. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - semgrep
      - dependency-check
      - osv
      - checkov

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .


  # ============================================================
  # 7. SYFT - SBOM GENERATION
  # ============================================================
  syft:
    name: Syft - Generate SBOM
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: security-demo:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json


  # ============================================================
  # 8. GRYPE - CONTAINER VULNERABILITY SCANNING
  # ============================================================
  grype:
    name: Grype - Container Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .

      - name: Scan with Grype
        id: grype-scan
        uses: anchore/scan-action@v7
        with:
          image: security-demo:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          cache-db: false
          output-format: sarif

      - name: Upload Grype report
        if: always() && steps.grype-scan.outputs.sarif != ''
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: ${{ steps.grype-scan.outputs.sarif }}


  # ============================================================
  # 9. FINAL SECURITY GATE
  # ============================================================
  security-gate:
    name: Final Security Gate
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - semgrep
      - dependency-check
      - osv
      - checkov
      - grype

    steps:
      - name: Security checks passed
        run: |
          echo "===================================="
          echo " SECURITY PIPELINE PASSED"
          echo "===================================="
          echo ""
          echo "Gitleaks:          PASS"
          echo "Semgrep:           PASS"
          echo "Dependency Check:  PASS"
          echo "OSV Scanner:       PASS"
          echo "Checkov:           PASS"
          echo "Grype:             PASS"
          echo ""
          echo "All mandatory security checks passed."