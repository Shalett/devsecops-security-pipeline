name: Security Scanner Comparison

on:
  push:
    branches:
      - security-test

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:

  # ============================================================
  # 1. GITLEAKS - SECRET SCANNING
  # ============================================================
  gitleaks:
    name: Gitleaks - Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Note
        if: always()
        run: echo "Gitleaks scan completed."


  # ============================================================
  # 2. SEMGREP - SAST
  # ============================================================
  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --sarif \
            --output /src/semgrep.sarif

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ============================================================
  # 3. SCANOSS - OSS / SCA / LICENSE
  # ============================================================
  scanoss:
    name: SCANOSS - OSS/SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run SCANOSS
        id: scanoss
        uses: scanoss/gha-code-scan@v1
        continue-on-error: true
        with:
          dependencies.enabled: true
          dependencies.scope: prod
          output.filepath: scanoss-raw.json
          policies.halt_on_failure: false

      - name: Show SCANOSS result
        if: always()
        run: |
          echo "SCANOSS result file:"
          ls -lh scanoss-raw.json || true

      - name: Upload SCANOSS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanoss-report
          path: scanoss-raw.json
          if-no-files-found: warn
  # ============================================================
  # 4. CHECKOV - INFRASTRUCTURE AS CODE
  # ============================================================
  checkov:
    name: Checkov - IaC Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform
          framework: terraform
          soft_fail: false

      - name: Note
        if: always()
        run: echo "Checkov scan completed."


  # ============================================================
  # 5. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - semgrep
      - scanoss
      - checkov

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .


  # ============================================================
  # 6. SYFT - SBOM
  # ============================================================
  syft:
    name: Syft - Generate SBOM
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: security-demo:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload Syft SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syft-sbom
          path: sbom.spdx.json


  # ============================================================
  # 7. GRYPE - VULNERABILITY SCANNING
  # ============================================================
  grype:
    name: Grype - Vulnerability Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .

      - name: Install Grype
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Grype
        continue-on-error: true
        run: |
          grype security-demo:${{ github.sha }} \
            --output json \
            --file grype-results.json

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-results.json


  # ============================================================
  # 8. TRIVY - VULNERABILITY SCANNING
  # ============================================================
  trivy:
    name: Trivy - Vulnerability Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .

      - name: Run Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: security-demo:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json


  # ============================================================
  # 9. COMPARISON SUMMARY
  # ============================================================
  comparison:
    name: Scanner Comparison
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - semgrep
      - scanoss
      - checkov
      - syft
      - grype
      - trivy

    if: always()

    steps:
      - name: Display comparison information
        run: |
          echo "=========================================="
          echo " SECURITY SCANNER COMPARISON"
          echo "=========================================="
          echo ""
          echo "Gitleaks = Secret scanning"
          echo "Semgrep  = SAST"
          echo "SCANOSS  = OSS / SCA / License"
          echo "Checkov  = Infrastructure as Code"
          echo "Syft     = SBOM"
          echo "Grype    = Vulnerability scanning"
          echo "Trivy    = Vulnerability scanning"
          echo ""
          echo "All scanner reports should be available"
          echo "under the Actions run artifacts."