name: Security Scanning Demo

on:
  push:
    branches:
      - security-test

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SEMGREP - SAST
  # ============================================================
  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --sarif \
            --output /src/semgrep.sarif

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif


  # ============================================================
  # 2. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .


  # ============================================================
  # 3. SYFT - SBOM
  # ============================================================
  syft:
    name: Syft - Generate SBOM
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: security-demo:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json


  # ============================================================
  # 4. GRYPE - VULNERABILITY SCANNING
  # ============================================================
  grype:
    name: Grype - Vulnerability Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo:${{ github.sha }} \
            .

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan image with Grype
        id: grype-scan
        continue-on-error: true
        run: |
          grype security-demo:${{ github.sha }} \
            --output sarif \
            --file grype.sarif \
            --fail-on critical

      - name: Upload Grype vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype.sarif

      - name: Enforce Grype security gate
        if: steps.grype-scan.outcome == 'failure'
        run: |
          echo "Grype found critical vulnerabilities."
          exit 1